services:
  postgres:
    image: postgres:17-alpine
    secrets:
      - postgres_password
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    networks:
      - net_database
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.10-alpine
    secrets:
      - redis_password
    command:
      - sh
      - -c
      - exec docker-entrypoint.sh redis-server --requirepass "$$(cat /run/secrets/redis_password)" --maxmemory 128mb --maxmemory-policy noeviction
    networks:
      - net_cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", REDISCLI_AUTH="$$(cat /run/secrets/redis_password)" redis-cli ping | grep -q PONG]
      interval: 5s
      timeout: 3s
      retries: 20

networks:
  net_database:
  net_cache:

volumes:
  postgresql_data:


secrets:
  postgres_password:
    file: ./secrets/postgres_password
  redis_password:
    file: ./secrets/redis_password